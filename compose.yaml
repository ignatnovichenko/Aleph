services:
  aleph:
    build: .
    restart: unless-stopped
    init: true
    environment:
      BIND: 0.0.0.0
      MINI_APP_URL: https://${ALEPH_DOMAIN:?set ALEPH_DOMAIN}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram
      OPENCODE_API_KEY_FILE: /run/secrets/opencode
      OPENCODE_MODEL: ${OPENCODE_MODEL:-claude-haiku-5-5}
      OPENCODE_FALLBACK_MODEL: ${OPENCODE_FALLBACK_MODEL:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/go/v1}
      ALEPH_CHATGPT_OWNER_ID: ${ALEPH_CHATGPT_OWNER_ID:-}
      ALEPH_CHATGPT_DIR: /data/chatgpt
      ALEPH_BOT_USERNAME: ${ALEPH_BOT_USERNAME:-AlephAgentBot}
      ALEPH_INTEGRATIONS_ORIGIN: ${ALEPH_INTEGRATIONS_ORIGIN:-}
      ALEPH_INTEGRATIONS_KEY: ${ALEPH_INTEGRATIONS_KEY:-}
      ALEPH_GOOGLE_CLIENT_ID: ${ALEPH_GOOGLE_CLIENT_ID:-}
      ALEPH_GOOGLE_CLIENT_SECRET: ${ALEPH_GOOGLE_CLIENT_SECRET:-}
      ALEPH_GOOGLE_PROJECT_NUMBER: ${ALEPH_GOOGLE_PROJECT_NUMBER:-}
      ALEPH_GOOGLE_PICKER_KEY: ${ALEPH_GOOGLE_PICKER_KEY:-}
      ALEPH_NOTION_CLIENT_ID: ${ALEPH_NOTION_CLIENT_ID:-}
      ALEPH_NOTION_CLIENT_SECRET: ${ALEPH_NOTION_CLIENT_SECRET:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - aleph_data:/data
    secrets: [telegram, opencode]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ALEPH_DOMAIN: ${ALEPH_DOMAIN:?set ALEPH_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
secrets:
  telegram:
    file: ${TELEGRAM_BOT_TOKEN_FILE:?set Telegram secret file path}
  opencode:
    file: ${OPENCODE_API_KEY_FILE:?set OpenCode secret file path}
volumes:
  aleph_data:
  caddy_data:
  caddy_config:
