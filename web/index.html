<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Aleph</title>
    <link rel="icon" href="./aleph.webp" type="image/webp" />
    <!-- Startup -->
    <script async id="telegram-sdk" src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./app.js"></script>
    <!-- App styles -->
  </head>
  <body>
    <div class="shell" id="app" aria-busy="true" aria-label="Aleph">
      <div class="boot workspace" role="status" aria-label="Aleph">
        <div aria-hidden="true">
          <div class="boot-head"><img alt="" src="./aleph.webp" width="32" height="32" decoding="async"><span></span></div>
          <div class="boot-list"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <dialog id="sheet"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
