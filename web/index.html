<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Aleph</title>
    <link rel="icon" href="./aleph.webp" type="image/webp" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script async src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell" id="app" aria-busy="true" aria-label="Aleph">
      <div class="boot" role="status" aria-label="Aleph">
        <img alt="Aleph" src="./aleph.webp" width="48" height="48" /><span class="loading-track" aria-hidden="true"></span>
      </div>
    </div>
    <dialog id="sheet"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
